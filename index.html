<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prosty Klikacz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #strefa-klikania {
      height: 250px;
      background-color: lightcoral;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 8px;
    }

    #strefa-klikania:hover {
      background-color: indianred;
    }

    #ranking td, #ranking th {
      border: 1px solid black;
      padding: 5px;
      text-align: center;
    }

    #ranking {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    .tooltip {
      display: none;
      position: absolute;
      background: #222;
      color: white;
      padding: 5px;
      font-size: 12px;
      border-radius: 5px;
    }

    tr:hover .tooltip {
      display: block;
    }
  </style>
</head>
<body class="p-3">

<h2>Prosty Klikacz – przykład</h2>

<div class="mb-3">
  <div id="czas">Pozostały czas: 0</div>
  <div id="klikniecia">Liczba kliknięć: 0</div>
  <button id="rozpocznij" class="btn btn-success btn-sm">Start</button>
  <button id="zresetuj" class="btn btn-secondary btn-sm">Reset</button>
</div>

<div id="strefa-klikania" class="mb-3">Klikaj tutaj!</div>

<div class="mb-3">
  <label>Twój pseudonim:</label>
  <input type="text" id="pseudonim" class="form-control" placeholder="Wpisz pseudonim">
  <button id="zapisz-wynik" class="mt-2 btn btn-primary">Zapisz wynik</button>
</div>

<h3>Podgląd zapisu:</h3>
<div class="widok border p-2 mb-3">
  <div>Pseudonim: <span id="widok-nick">-</span></div>
  <div>Wynik: <span id="widok-wynik">0</span></div>
</div>

<h3>Ranking:</h3>
<table id="ranking">
  <thead>
    <tr>
      <th>#</th>
      <th>Pseudonim</th>
      <th>Wynik</th>
      <th>AutoKlikacze</th>
      <th>?</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="mt-3">
  <button id="eksportuj" class="btn btn-success btn-sm">Eksportuj ranking</button>
  <input type="file" id="importuj" class="form-control mt-2">
</div>

<script>
  let czasPozostaly = 10;
  let liczbaKlikniec = 0;
  let timerId = null;
  let rankingGraczy = [];

  let strefaKlikania = document.getElementById('strefa-klikania');
  let liczbaKlikniecEl = document.getElementById('klikniecia');
  let czasEl = document.getElementById('czas');
  let rozpocznijBtn = document.getElementById('rozpocznij');
  let zresetujBtn = document.getElementById('zresetuj');
  let pseudonimInput = document.getElementById('pseudonim');
  let zapiszWynikBtn = document.getElementById('zapisz-wynik');
  let widokNick = document.getElementById('widok-nick');
  let widokWynik = document.getElementById('widok-wynik');
  let rankingBody = document.querySelector('#ranking tbody');
  let eksportujBtn = document.getElementById('eksportuj');
  let importujPlik = document.getElementById('importuj');

  // --- Start gry ---
  rozpocznijBtn.onclick = function() {
    liczbaKlikniec = 0;
    czasPozostaly = 10;
    liczbaKlikniecEl.innerText = "Liczba kliknięć: " + liczbaKlikniec;
    czasEl.innerText = "Pozostały czas: " + czasPozostaly;
    rozpocznijBtn.disabled = true;

    timerId = setInterval(function() {
      czasPozostaly--;
      czasEl.innerText = "Pozostały czas: " + czasPozostaly;
      if (czasPozostaly <= 0) {
        clearInterval(timerId);
        rozpocznijBtn.disabled = false;
      }
    }, 1000);
  }

  // --- Reset gry ---
  zresetujBtn.onclick = function() {
    clearInterval(timerId);
    liczbaKlikniec = 0;
    czasPozostaly = 0;
    liczbaKlikniecEl.innerText = "Liczba kliknięć: 0";
    czasEl.innerText = "Pozostały czas: 0";
    rozpocznijBtn.disabled = false;
  }

  // --- Klikacz ---
  strefaKlikania.onclick = function() {
    if (czasPozostaly > 0) {
      liczbaKlikniec++;
      liczbaKlikniecEl.innerText = "Liczba kliknięć: " + liczbaKlikniec;
      widokWynik.innerText = liczbaKlikniec;
    }
  }

  // --- Podgląd pseudonimu ---
  pseudonimInput.oninput = function() {
    widokNick.innerText = pseudonimInput.value || "-";
  }

  // --- Zapis wyniku ---
  zapiszWynikBtn.onclick = function() {
    let pseudonim = pseudonimInput.value.trim();
    if (!pseudonim) {
      alert("Podaj pseudonim!");
      return;
    }
    let gracz = {
      pseudonim: pseudonim,
      wynik: liczbaKlikniec,
      dodatkowe: { autoKlikacze: Math.floor(Math.random() * 5) }
    };

    let istnieje = rankingGraczy.find(p => p.pseudonim === pseudonim);
    if (istnieje) {
      if (gracz.wynik > istnieje.wynik) istnieje.wynik = gracz.wynik;
      istnieje.dodatkowe = gracz.dodatkowe;
    } else {
      rankingGraczy.push(gracz);
    }

    rankingGraczy.sort(function(a,b){return b.wynik - a.wynik;});
    wyswietlRanking();
  }

  // --- Wyświetlenie rankingu ---
  function wyswietlRanking() {
    rankingBody.innerHTML = "";
    for (let i = 0; i < rankingGraczy.length; i++) {
      let r = rankingGraczy[i];
      let tr = document.createElement("tr");
      tr.innerHTML = "<td>" + (i + 1) + "</td><td>" + r.pseudonim + "</td><td>" + r.wynik + "</td><td>" + r.dodatkowe.autoKlikacze + "</td><td><span class='tooltip'>AutoKlikacze: " + r.dodatkowe.autoKlikacze + "</span>❓</td>";
      rankingBody.appendChild(tr);
    }
  }

  // --- Eksport ---
  eksportujBtn.onclick = function() {
    let blob = new Blob([JSON.stringify(rankingGraczy)], { type: "application/json" });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ranking.json";
    a.click();
  }

  // --- Import ---
  importujPlik.onchange = function(e) {
    let plik = e.target.files[0];
    if (!plik) return;
    let reader = new FileReader();
    reader.onload = function(ev) {
      rankingGraczy = JSON.parse(ev.target.result);
      wyswietlRanking();
    }
    reader.readAsText(plik);
  }
</script>

</body>
</html>
